<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7C5CFF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Rounded Hexagon / Shield -->
  <rect width="64" height="64" rx="16" fill="#0A0E1A" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#shieldGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Outer Cyber Shield Contour -->
  <path d="M32 9L49 16.5V29C49 40.5 41.8 50.8 32 55C22.2 50.8 15 40.5 15 29V16.5L32 9Z" 
        fill="url(#glowGrad)" fill-opacity="0.25" 
        stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Radar / Target Rings -->
  <circle cx="32" cy="31" r="12" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.7" />
  <circle cx="32" cy="31" r="6" stroke="#7C5CFF" stroke-width="1.5" stroke-opacity="0.9" />

  <!-- Center Intelligence Core -->
  <circle cx="32" cy="31" r="2.5" fill="#00F0FF" filter="url(#glow)" />

  <!-- Crosshair Radar Beams -->
  <line x1="32" y1="16" x2="32" y2="46" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
  <line x1="17" y1="31" x2="47" y2="31" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
</svg>
